# Tuned for long-running Claude Code sessions, locally and over SSH.

if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
	'set -g default-terminal tmux-256color' \
	'set -g default-terminal screen-256color'
set -as terminal-features ',*:RGB'

set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
# Lets Shift+Enter and other modified keys reach Claude Code.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# OSC 52: copying inside tmux reaches the local clipboard, even over SSH.
set -s set-clipboard on
set -g allow-passthrough on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Closing a session moves to another one instead of detaching.
set -g detach-on-destroy off

# Host first, so it is obvious which machine a session is on.
set -g status-style 'bg=#2b2b2b,fg=#ddd9d2'
set -g status-left-length 40
set -g status-left '#[fg=#80857d,bold]#h#[default]:#S  '
set -g status-right '%H:%M'
setw -g window-status-current-style 'fg=#80857d,bold'

bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'
